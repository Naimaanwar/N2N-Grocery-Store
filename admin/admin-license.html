<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N2N Grocery Store - License Activation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 400px;
      max-width: 90%;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #198754;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #157347;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 N2N Grocery Store</h1>

    <p>Admin License Activation</p>

    <input
      type="text"
      id="licenseKey"
      value="N2N-2026-ADMIN-1YEAR"
      placeholder="Enter License Key"
    >

    <button id="activateBtn">
      Activate 1-Year License
    </button>

    <div id="message"></div>

  </div>

  <script>
  const API_URL =
    window.location.hostname === 'localhost'
      ? 'http://localhost:5000'
      : window.location.origin

  const button =
    document.getElementById('activateBtn')

  const message =
    document.getElementById('message')

  button.addEventListener('click', async () => {

    const licenseKey =
      document
        .getElementById('licenseKey')
        .value
        .trim()

    if (!licenseKey) {
      message.style.color = 'red'
      message.textContent =
        'Please enter license key.'
      return
    }

    button.disabled = true
    button.textContent = 'Activating...'

    try {

      const response = await fetch(
        `${API_URL}/api/admin/activate-license`,
        {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            licenseKey: licenseKey
          })
        }
      )

      const data = await response.json()

      if (!response.ok) {

        message.style.color = 'red'

        message.textContent =
          data.message ||
          'License activation failed.'

        button.disabled = false
        button.textContent =
          'Activate 1-Year License'

        return
      }

      const expiry =
        new Date(data.expiryDate)

      message.style.color = 'green'

      message.innerHTML =
        `
        ✅ License Activated Successfully!
        <br><br>
        Expiry Date:
        ${expiry.toLocaleDateString()}
        <br><br>
        Redirecting to Admin Login...
        `

      setTimeout(() => {

        window.location.href =
          '/admin/admin-login.html'

      }, 2000)

    } catch (error) {

      console.error(error)

      message.style.color = 'red'

      message.textContent =
        'Backend connection failed.'

      button.disabled = false

      button.textContent =
        'Activate 1-Year License'
    }

  })
</script>

</body>

</html>
