
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel - Grocery Store</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .admin-header {
      background: #222;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .admin-header h1 {
      margin: 0 0 8px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      flex: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
      margin: 0 0 10px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .refresh-button {
      margin-bottom: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 15px;
    }

    .refresh-button:hover {
      opacity: 0.85;
    }

    .search-input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #555;
    }

    .orders-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f0f2f5;
    }

    .status-select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      background: white;
      min-width: 150px;
    }

    .order-details-button {
      border: none;
      background: none;
      padding: 0;
      font-weight: bold;
      color: #222;
      cursor: pointer;
      font-size: 15px;
    }

    .order-details-button:hover {
      text-decoration: underline;
    }

    .order-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .order-actions button {
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .cancel-order-button {
      background: #f8d7da;
      color: #842029;
    }

    .reopen-order-button {
      background: #d1e7dd;
      color: #0f5132;
    }

    .lock-order-button {
      background: #fff3cd;
      color: #664d03;
    }

    .unlock-order-button {
      background: #cfe2ff;
      color: #084298;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    /* =========================
       ORDER MODAL
    ========================= */

    #order-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-box {
      background: white;
      width: 90%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #222;
      margin: 0;
    }

    #close-order-modal {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    #close-order-modal:hover {
      background: #ddd;
    }

    #order-details-content {
      font-size: 15px;
      line-height: 1.6;
    }

    #order-details-content p {
      margin: 10px 0;
      padding: 10px;
      background: #f7f8fa;
      border-radius: 6px;
    }

    #order-details-content h3 {
      margin-top: 20px;
    }

    #order-details-content h2 {
      margin-top: 15px;
      padding: 12px;
      background: #f0f2f5;
      border-radius: 8px;
    }

    .order-product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      margin: 8px 0;
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .stats {
        flex-direction: column;
      }

      .admin-container {
        padding: 0 10px;
      }

      .orders-box {
        padding: 10px;
      }

    }

  </style>

</head>


<body>

  <header class="admin-header">

    <h1>🧑‍💼 Grocery Store Admin Panel</h1>

    <p>Manage and view customer orders</p>

  </header>


  <main class="admin-container">

    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">

      <div class="stat-card">

        <h3>
          Total Orders
        </h3>

        <strong id="total-orders">
          0
        </strong>

      </div>


      <div class="stat-card">

        <h3>
          Total Sales
        </h3>

        <strong id="total-sales">
          Rs. 0
        </strong>

      </div>

    </div>


    <!-- =========================
         REFRESH
    ========================= -->

    <button
      id="refresh-orders"
      class="refresh-button"
    >
      🔄 Refresh Orders
    </button>


    <!-- =========================
         SEARCH
    ========================= -->

    <input
      type="text"
      id="order-search"
      class="search-input"
      placeholder="🔍 Search by order number, name, phone, address or product..."
    >


    <!-- =========================
         ORDERS
    ========================= -->

    <section class="orders-box">

      <h2>
        📦 Customer Orders
      </h2>

      <div id="orders-container">

        <div class="empty">
          Loading orders...
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       ORDER DETAILS MODAL
  ========================= -->

  <div
    id="order-modal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="modal-order-number">
          Order Details
        </h2>

        <button
          id="close-order-modal"
        >
          ×
        </button>

      </div>

      <div id="order-details-content"></div>

    </div>

  </div>


  <script type="module">

    /*
      Vite API URL
    */

    const API_URL = window.location.origin

    let allOrders = []


    // =========================
    // LOAD ORDERS
    // =========================

    async function loadOrders() {

      const container =
        document.getElementById(
          'orders-container'
        )


      try {

        const response =
          await fetch(
            `${API_URL}/api/orders`
          )


        if (!response.ok) {

          throw new Error(
            'Failed to load orders'
          )

        }


        allOrders =
          await response.json()


        // Total Orders

        document.getElementById(
          'total-orders'
        ).textContent =
          allOrders.length


        // Total Sales

        const totalSales =
          allOrders.reduce(
            (sum, order) =>
              sum +
              Number(
                order.total || 0
              ),
            0
          )


        document.getElementById(
          'total-sales'
        ).textContent =
          `Rs. ${totalSales.toLocaleString()}`


        displayOrders(
          allOrders
        )


      } catch (error) {

        console.error(
          'Could not load orders:',
          error
        )


        container.innerHTML = `

          <div class="empty">

            ❌ Could not load orders.

            <br><br>

            Make sure the backend is running.

          </div>

        `

      }

    }


    // =========================
    // DISPLAY ORDERS
    // =========================

    function displayOrders(
      orders
    ) {

      const container =
        document.getElementById(
          'orders-container'
        )


      if (
        orders.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            🔍 No matching orders found.

          </div>

        `

        return

      }


      container.innerHTML = `

        <table>

          <thead>

            <tr>

              <th>
                Order
              </th>

              <th>
                Customer
              </th>

              <th>
                Contact
              </th>

              <th>
                Address
              </th>

              <th>
                Products
              </th>

              <th>
                Payment
              </th>

              <th>
                Status
              </th>

              <th>
                Total
              </th>

            </tr>

          </thead>


          <tbody>

            ${orders.map(
              order => `

              <tr>

                <!-- Order Number -->

                <td>

                  <button
                    class="order-details-button"
                    data-order="${order.orderNumber}"
                  >
                    #${order.orderNumber}
                  </button>

                </td>


                <!-- Customer -->

                <td>
                  ${order.name || 'N/A'}
                </td>


                <!-- Phone -->

                <td>
                  ${order.phone || 'N/A'}
                </td>


                <!-- Address -->

                <td>

                  ${order.address || 'N/A'}

                  <br>

                  ${order.city || ''}

                </td>


                <!-- Products -->

                <td>

                  ${(order.items || [])
                    .map(
                      item => `

                        <div>

                          ${item.name || item.id}

                          ×

                          ${item.quantity || 1}

                        </div>

                      `
                    )
                    .join('')
                  }

                </td>


                <!-- Payment -->

                <td>

                  ${order.paymentMethod || 'N/A'}

                </td>


                <!-- Status -->

                <td>

                  <select
                    class="status-select"
                    data-order="${order.orderNumber}"
                    onchange="updateStatusColor(this)"
                  >

                    <option
                      value="Pending"
                      ${order.status === 'Pending' ? 'selected' : ''}
                    >
                      Pending
                    </option>

                    <option
                      value="Confirmed"
                      ${order.status === 'Confirmed' ? 'selected' : ''}
                    >
                      Confirmed
                    </option>

                    <option
                      value="Preparing"
                      ${order.status === 'Preparing' ? 'selected' : ''}
                    >
                      Preparing
                    </option>

                    <option
                      value="Out for Delivery"
                      ${order.status === 'Out for Delivery' ? 'selected' : ''}
                    >
                      Out for Delivery
                    </option>

                    <option
                      value="Delivered"
                      ${order.status === 'Delivered' ? 'selected' : ''}
                    >
                      Delivered
                    </option>

                    <option
                      value="Cancelled"
                      ${order.status === 'Cancelled' ? 'selected' : ''}
                    >
                      Cancelled
                    </option>

                  </select>


                  <div
                    class="order-actions"
                    style="margin-top: 10px;"
                  >

                    ${
                      order.status !== 'Cancelled'
                        ? `
                          <button
                            class="cancel-order-button"
                            data-order="${order.orderNumber}"
                          >
                            ❌ Cancel
                          </button>
                        `
                        : ''
                    }


                    ${
                      order.status === 'Cancelled'
                        ? `
                          <button
                            class="reopen-order-button"
                            data-order="${order.orderNumber}"
                          >
                            🔄 Reopen
                          </button>
                        `
                        : ''
                    }


                    ${
                      order.locked !== true
                        ? `
                          <button
                            class="lock-order-button"
                            data-order="${order.orderNumber}"
                          >
                            🔒 Lock
                          </button>
                        `
                        : ''
                    }


                    ${
                      order.locked === true
                        ? `
                          <button
                            class="unlock-order-button"
                            data-order="${order.orderNumber}"
                          >
                            🔓 Unlock
                          </button>
                        `
                        : ''
                    }

                  </div>

                </td>


                <!-- Total -->

                <td>

                  <strong>
                    Rs.
                    ${Number(
                      order.total || 0
                    ).toLocaleString()}
                  </strong>

                </td>

              </tr>

            `
            ).join('')}

          </tbody>

        </table>

      `


      // Apply status colors

      document
        .querySelectorAll(
          '.status-select'
        )
        .forEach(
          select =>
            updateStatusColor(
              select
            )
        )

    }


    // =========================
    // REFRESH ORDERS
    // =========================

    document
      .getElementById(
        'refresh-orders'
      )
      .addEventListener(
        'click',
        loadOrders
      )


    // =========================
    // SEARCH ORDERS
    // =========================

    const searchInput =
      document.getElementById(
        'order-search'
      )


    searchInput.addEventListener(
      'input',
      () => {

        const searchText =
          searchInput.value
            .toLowerCase()
            .trim()


        const filteredOrders =
          allOrders.filter(
            order => {

              const orderNumber =
                String(
                  order.orderNumber || ''
                )
                  .toLowerCase()


              const name =
                String(
                  order.name || ''
                )
                  .toLowerCase()


              const phone =
                String(
                  order.phone || ''
                )
                  .toLowerCase()


              const address =
                String(
                  order.address || ''
                )
                  .toLowerCase()


              const city =
                String(
                  order.city || ''
                )
                  .toLowerCase()


              const payment =
                String(
                  order.paymentMethod || ''
                )
                  .toLowerCase()


              const products =
                (order.items || [])
                  .map(
                    item =>
                      String(
                        item.name ||
                        item.id ||
                        ''
                      )
                  )
                  .join(' ')
                  .toLowerCase()


              return (

                orderNumber.includes(
                  searchText
                )

                ||

                name.includes(
                  searchText
                )

                ||

                phone.includes(
                  searchText
                )

                ||

                address.includes(
                  searchText
                )

                ||

                city.includes(
                  searchText
                )

                ||

                payment.includes(
                  searchText
                )

                ||

                products.includes(
                  searchText
                )

              )

            }
          )


        displayOrders(
          filteredOrders
        )

      }
    )


    // =========================
    // STATUS UPDATE
    // =========================

    document.addEventListener(
      'change',
      async event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'status-select'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        const status =
          target.value


        try {

          const response =
            await fetch(
              `${API_URL}/api/orders/${orderNumber}`,
              {

                method: 'PATCH',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({
                    status: status
                  })

              }
            )


          const result =
            await response.json()


          if (!response.ok) {

            throw new Error(
              result.message ||
              'Status update failed'
            )

          }


          console.log(
            'Status updated:',
            result.order
          )


          const index =
            allOrders.findIndex(
              order =>
                order.orderNumber ===
                orderNumber
            )


          if (index !== -1) {

            allOrders[index].status =
              status

          }


        } catch (error) {

          console.error(
            'Status update failed:',
            error
          )


          alert(
            error.message ||
            'Could not update order status.'
          )


          await loadOrders()

        }

      }
    )


    // =========================
    // ORDER DETAILS
    // =========================

    document.addEventListener(
      'click',
      event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'order-details-button'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        const order =
          allOrders.find(
            item =>
              item.orderNumber ===
              orderNumber
          )


        if (!order) {

          alert(
            'Order not found.'
          )

          return

        }


        document.getElementById(
          'modal-order-number'
        ).textContent =
          `Order #${order.orderNumber}`


        document.getElementById(
          'order-details-content'
        ).innerHTML = `

          <p>
            <strong>👤 Customer:</strong>
            ${order.name || 'N/A'}
          </p>

          <p>
            <strong>📱 Phone:</strong>
            ${order.phone || 'N/A'}
          </p>

          <p>
            <strong>📍 Address:</strong>
            ${order.address || 'N/A'},
            ${order.city || ''}
          </p>

          <p>
            <strong>💳 Payment:</strong>
            ${order.paymentMethod || 'N/A'}
          </p>

          <p>
            <strong>📦 Status:</strong>
            ${order.status || 'Pending'}
          </p>

          <p>
            <strong>🔒 Lock:</strong>
            ${
              order.locked
                ? 'Locked'
                : 'Unlocked'
            }
          </p>

          <hr>

          <h3>
            🛒 Products
          </h3>

          ${
            (order.items || [])
              .map(
                item => `
                  <div class="order-product-card">

                    <span>
                      🛒
                      ${item.name || item.id}
                    </span>

                    <strong>
                      × ${item.quantity || 1}
                    </strong>

                  </div>
                `
              )
              .join('')
          }

          <hr>

          <h2>
            💰 Total:
            Rs.
            ${Number(
              order.total || 0
            ).toLocaleString()}
          </h2>

        `


        document.getElementById(
          'order-modal'
        ).style.display =
          'flex'

      }
    )


    // =========================
    // CLOSE MODAL
    // =========================

    document
      .getElementById(
        'close-order-modal'
      )
      .addEventListener(
        'click',
        () => {

          document.getElementById(
            'order-modal'
          ).style.display =
            'none'

        }
      )


    // Close modal when clicking outside

    document
      .getElementById(
        'order-modal'
      )
      .addEventListener(
        'click',
        event => {

          if (
            event.target.id ===
            'order-modal'
          ) {

            document.getElementById(
              'order-modal'
            ).style.display =
              'none'

          }

        }
      )


    // =========================
    // STATUS COLORS
    // =========================

    function updateStatusColor(
      select
    ) {

      if (
        select.value ===
        'Pending'
      ) {

        select.style.background =
          '#fff3cd'

      }

      else if (
        select.value ===
        'Confirmed'
      ) {

        select.style.background =
          '#d1ecf1'

      }

      else if (
        select.value ===
        'Preparing'
      ) {

        select.style.background =
          '#e2d9f3'

      }

      else if (
        select.value ===
        'Out for Delivery'
      ) {

        select.style.background =
          '#cfe2ff'

      }

      else if (
        select.value ===
        'Delivered'
      ) {

        select.style.background =
          '#d1e7dd'

      }

      else if (
        select.value ===
        'Cancelled'
      ) {

        select.style.background =
          '#f8d7da'

      }

    }


    // =========================
    // CANCEL ORDER
    // =========================

    document.addEventListener(
      'click',
      async event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'cancel-order-button'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        const confirmCancel =
          confirm(
            `Are you sure you want to cancel order #${orderNumber}?`
          )


        if (!confirmCancel) {

          return

        }


        try {

          const response =
            await fetch(
              `${API_URL}/api/orders/${orderNumber}`,
              {

                method: 'PATCH',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({
                    status:
                      'Cancelled'
                  })

              }
            )


          const result =
            await response.json()


          if (!response.ok) {

            throw new Error(
              result.message ||
              'Cancel failed'
            )

          }


          alert(
            'Order cancelled successfully.'
          )


          await loadOrders()


        } catch (error) {

          console.error(
            'Cancel order failed:',
            error
          )


          alert(
            'Could not cancel the order.'
          )

        }

      }
    )


    // =========================
    // REOPEN ORDER
    // =========================

    document.addEventListener(
      'click',
      async event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'reopen-order-button'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        try {

          const response =
            await fetch(
              `${API_URL}/api/orders/${orderNumber}`,
              {

                method: 'PATCH',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({

                    status:
                      'Confirmed',

                    locked:
                      false

                  })

              }
            )


          const result =
            await response.json()


          if (!response.ok) {

            throw new Error(
              result.message ||
              'Reopen failed'
            )

          }


          alert(
            'Order reopened successfully.'
          )


          await loadOrders()


        } catch (error) {

          console.error(
            'Reopen order failed:',
            error
          )


          alert(
            'Could not reopen the order.'
          )

        }

      }
    )


    // =========================
    // LOCK ORDER
    // =========================

    document.addEventListener(
      'click',
      async event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'lock-order-button'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        const confirmLock =
          confirm(
            `Are you sure you want to LOCK order #${orderNumber}?`
          )


        if (!confirmLock) {

          return

        }


        try {

          const response =
            await fetch(
              `${API_URL}/api/orders/${orderNumber}`,
              {

                method: 'PATCH',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({
                    locked: true
                  })

              }
            )


          const result =
            await response.json()


          if (!response.ok) {

            throw new Error(
              result.message ||
              'Lock failed'
            )

          }


          alert(
            'Order locked successfully.'
          )


          await loadOrders()


        } catch (error) {

          console.error(
            'Lock order failed:',
            error
          )


          alert(
            'Could not lock the order.'
          )

        }

      }
    )


    // =========================
    // UNLOCK ORDER
    // =========================

    document.addEventListener(
      'click',
      async event => {

        const target =
          event.target


        if (
          !target.classList.contains(
            'unlock-order-button'
          )
        ) {

          return

        }


        const orderNumber =
          target.dataset.order


        const confirmUnlock =
          confirm(
            `Are you sure you want to UNLOCK order #${orderNumber}?`
          )


        if (!confirmUnlock) {

          return

        }


        try {

          const response =
            await fetch(
              `${API_URL}/api/orders/${orderNumber}`,
              {

                method: 'PATCH',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({
                    locked: false
                  })

              }
            )


          const result =
            await response.json()


          if (!response.ok) {

            throw new Error(
              result.message ||
              'Unlock failed'
            )

          }


          alert(
            'Order unlocked successfully.'
          )


          await loadOrders()


        } catch (error) {

          console.error(
            'Unlock order failed:',
            error
          )


          alert(
            'Could not unlock the order.'
          )

        }

      }
    )


    // =========================
    // START
    // =========================

    loadOrders()

  </script>

</body>

</html>
